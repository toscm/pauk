[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pauk"
version = "0.1.0"
description = "CLI client for the pauk flashcard app"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pauk = "pauk.main:run"

[tool.setuptools.packages.find]
include = ["pauk*"]
