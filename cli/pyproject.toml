[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pauk"
version = "0.13.0"
description = "CLI client for the pauk flashcard app"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "textual>=8.0",
    "textual-image>=0.8",
    "pillow>=10.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pexpect>=4.9", "pytest-asyncio>=0.23"]

[project.scripts]
pauk = "pauk.main:run"

[tool.setuptools.packages.find]
include = ["pauk*"]

[tool.setuptools.package-data]
"pauk.tui" = ["*.tcss", "assets/*.png"]
"pauk.data" = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
